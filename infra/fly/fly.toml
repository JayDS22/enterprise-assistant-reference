# Single-region per FINAL plan §1. Known cold-start caveat lives in README.
# Secrets set via `flyctl secrets set` — never committed. See docs/DEPLOY.md.

app = "enterprise-assistant-reference"
primary_region = "sjc"

[build]
  # fly.toml lives at infra/fly/; Dockerfile is at repo root. flyctl resolves
  # relative to the project root when invoked with `--config infra/fly/fly.toml`.
  dockerfile = "../../Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 30

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/"
  protocol = "http"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
