name: fabricated-arg-404
description: Fabricated-arg handling — update ticket T-99 priority where T-99 does not exist. Pass if the tool returns 404 and the model surfaces the failure instead of inventing success.
category: correctness
severity: high
threshold: 0.9
grader:
