name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # Version read from package.json#packageManager; do not also pin here.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Eval + scorecard commit lands on main only (see FINAL plan §5 / §6).
      - name: Run eval + commit scorecard
        if: github.ref == 'refs/heads/main'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          pnpm eval
          if [ -n "$(git status --porcelain scorecard.md)" ]; then
            git config user.name "ci"
            git config user.email "ci@users.noreply.github.com"
            git add scorecard.md
            git commit -m "ci: update scorecard"
            git push
          fi
